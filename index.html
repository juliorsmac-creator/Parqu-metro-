<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="stylo.css" rel="stylesheet">

    <title>Simulador de Parquímetro</title>
</head>
<body>
    <header>
        <h1>Simulador de Parquímetro</h1>
    </header>
    <main>
        <section>
            <label for="valor">Insira o valor</label>
            <input type="number" id="valor" step="0.01" min="0" placeholder="Digite o valor em reais">
            <button id="calcular">Calcular</button>
        </section>
        <section>
            <h2>Resultado</h2>
            <div id="resultado"></div>
        </section>
    </main>
    <script src="codigo.js"></script>
</body>

</html>
